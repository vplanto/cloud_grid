<!DOCTYPE html>
<html lang="{{ page.lang | default: "uk" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "ONU Cloud & Grid" }}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-light.min.css">

  <style>
    body,
    .markdown-body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: #1a1a1a;
    }

    .markdown-body pre,
    .markdown-body code,
    .markdown-body kbd,
    .markdown-body samp,
    pre, code, kbd, samp {
      font-family: 'IBM Plex Mono', 'Lilex', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
    }

    .markdown-body code:not(pre code) {
      padding: 0.2em 0.4em;
      border-radius: 4px;
      background-color: rgba(0, 0, 0, 0.05);
    }

    :root {
      --content-max: 980px;
      --content-pad-x: 45px;
      --content-pad-y: 45px;
    }

    @media (max-width: 767px) {
      :root {
        --content-pad-x: 15px;
        --content-pad-y: 15px;
      }
    }

    @media (min-width: 900px) {
      :root {
        --content-max: min(1120px, calc(100vw - 3rem));
      }
    }

    @media (min-width: 1280px) {
      :root {
        --content-max: min(1240px, calc(100vw - 4rem));
      }
    }

    @media (min-width: 1600px) {
      :root {
        --content-max: min(1380px, calc(100vw - 6rem));
      }
    }

    .page-shell {
      box-sizing: border-box;
      width: 100%;
      max-width: var(--content-max);
      margin-left: auto;
      margin-right: auto;
      padding-left: var(--content-pad-x);
      padding-right: var(--content-pad-x);
    }

    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: none;
      width: 100%;
      margin: 0;
      padding-top: var(--content-pad-y);
      padding-bottom: var(--content-pad-y);
      padding-left: 0;
      padding-right: 0;
    }

    .site-footer {
      font-size: 0.85em;
      color: #57606a;
      border-top: 1px solid #d0d7de;
      padding-bottom: 30px;
    }

    .page-hub.page-shell {
      --content-max: min(56rem, calc(100vw - 2rem));
    }

    .page-hub h2 {
      margin-top: 2.25rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #d0d7de;
    }

    .page-hub h3 {
      margin-top: 1.5rem;
      margin-bottom: 0.65rem;
    }

    .page-hub > table,
    .page-hub table {
      border: 1px solid #d0d7de;
      border-radius: 8px;
      overflow: hidden;
    }

    .page-hub > ul {
      padding-left: 0;
      margin-top: 0.5rem;
    }

    .page-hub > ul > li {
      list-style: none;
      margin-bottom: 0.65rem;
      padding: 0.85rem 1.1rem;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
      border-radius: 8px;
    }

    .page-hub > ul > li > ul {
      margin: 0.65rem 0 0;
      padding-left: 1.15rem;
    }

    .page-hub > ul > li > ul > li {
      list-style: disc;
      margin-bottom: 0.35rem;
      padding: 0;
      background: none;
      border: none;
      border-radius: 0;
    }

    .page-hub > ul > li > ul > li:last-child {
      margin-bottom: 0;
    }

    .page-hub > ol {
      padding-left: 0;
      margin-top: 0.5rem;
    }

    .page-hub > ol > li {
      margin-bottom: 0.65rem;
      padding: 0.85rem 1.1rem;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      list-style-position: inside;
    }

    .page-hub .hub-block {
      margin: 1rem 0 1.25rem;
      padding: 1rem 1.15rem 1.1rem;
      background: #f6f8fa;
      border: 1px solid #d8dee4;
      border-radius: 8px;
    }

    .page-hub .hub-block > :first-child {
      margin-top: 0;
    }

    .page-hub .hub-block > :last-child {
      margin-bottom: 0;
    }

    .page-hub .hub-block > table {
      margin-top: 0.75rem;
      width: 100%;
    }

    .page-hub .hub-block blockquote {
      margin: 0.75rem 0 0;
    }

    /* Syntax Highlighting for Rouge (GitHub Pages) */
    .highlight { background: #ffffff; }
    .highlight .c { color: #999988; font-style: italic }
    .highlight .err { color: #a61717; background-color: #e3d2d2 }
    .highlight .k { font-weight: bold }
    .highlight .o { font-weight: bold }
    .highlight .cm { color: #999988; font-style: italic }
    .highlight .cp { color: #999999; font-weight: bold }
    .highlight .c1 { color: #999988; font-style: italic }
    .highlight .cs { color: #999999; font-weight: bold; font-style: italic }
    .highlight .gd { color: #000000; background-color: #ffdddd }
    .highlight .gd .x { color: #000000; background-color: #ffaaaa }
    .highlight .ge { font-style: italic }
    .highlight .gr { color: #aa0000 }
    .highlight .gh { color: #999999 }
    .highlight .gi { color: #000000; background-color: #ddffdd }
    .highlight .gi .x { color: #000000; background-color: #aaffaa }
    .highlight .go { color: #888888 }
    .highlight .gp { color: #555555 }
    .highlight .gs { font-weight: bold }
    .highlight .gu { color: #aaaaaa }
    .highlight .gt { color: #aa0000 }
    .highlight .kc { font-weight: bold }
    .highlight .kd { font-weight: bold }
    .highlight .kp { font-weight: bold }
    .highlight .kr { font-weight: bold }
    .highlight .kt { color: #445588; font-weight: bold }
    .highlight .m { color: #009999 }
    .highlight .s { color: #d14 }
    .highlight .na { color: #008080 }
    .highlight .nb { color: #0086B3 }
    .highlight .nc { color: #445588; font-weight: bold }
    .highlight .no { color: #008080 }
    .highlight .ni { color: #800080 }
    .highlight .ne { color: #990000; font-weight: bold }
    .highlight .nf { color: #990000; font-weight: bold }
    .highlight .nn { color: #555555 }
    .highlight .nt { color: #000080 }
    .highlight .nv { color: #008080 }
    .highlight .ow { font-weight: bold }
    .highlight .w { color: #bbbbbb }
    .highlight .mf { color: #009999 }
    .highlight .mh { color: #009999 }
    .highlight .mi { color: #009999 }
    .highlight .mo { color: #009999 }
    .highlight .sb { color: #d14 }
    .highlight .sc { color: #d14 }
    .highlight .sd { color: #d14 }
    .highlight .s2 { color: #d14 }
    .highlight .se { color: #d14 }
    .highlight .sh { color: #d14 }
    .highlight .si { color: #d14 }
    .highlight .sx { color: #d14 }
    .highlight .sr { color: #009926 }
    .highlight .s1 { color: #d14 }
    .highlight .ss { color: #990073 }
    .highlight .bp { color: #999999 }
    .highlight .vc { color: #008080 }
    .highlight .vg { color: #008080 }
    .highlight .vi { color: #008080 }
    .highlight .il { color: #009999 }
  </style>

  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <article class="markdown-body page-shell{% if page.hub %} page-hub{% endif %}">
    {{ content }}
  </article>
  <footer class="site-footer page-shell{% if page.hub %} page-hub{% endif %}">
    <p>
      <a href="{{ '/DISCLAIMER.html' | relative_url }}">Декларація курсу</a>
      · <a href="{{ '/n00_self_work.html' | relative_url }}">Регламент робіт</a>
      · <a href="{{ '/n01_power_grid_project.html' | relative_url }}">Проєкт IEEE-118</a>
      · ONU Cloud &amp; Grid
    </p>
  </footer>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

    // Налаштування
    mermaid.initialize({ startOnLoad: false });

    // Знаходимо всі блоки коду з мовою mermaid і перетворюємо їх
    document.addEventListener('DOMContentLoaded', () => {
      const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');

      mermaidBlocks.forEach((block) => {
        // Отримуємо сам код діаграми
        const content = block.textContent;
        // Створюємо новий div
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = content;

        // Замінюємо <pre><code> на <div class="mermaid">
        const pre = block.closest('pre');
        if (pre) {
          pre.parentNode.replaceChild(div, pre);
        }
      });

      // Трансформація GitHub Alert блоків (> [!NOTE], > [!IMPORTANT], тощо)
      const alertConfigs = {
        'NOTE': { class: 'markdown-alert-note', title: 'Note', icon: '<svg class="octicon octicon-info" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" style="display:inline-block;vertical-align:text-bottom;margin-right:8px;"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm8-6.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13ZM6.5 7.75A.75.75 0 0 1 7.25 7h1a.75.75 0 0 1 .75.75v2.75h.25a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1 0-1.5h.25v-2h-.25a.75.75 0 0 1-.75-.75ZM8 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>' },
        'TIP': { class: 'markdown-alert-tip', title: 'Tip', icon: '<svg class="octicon octicon-light-bulb" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" style="display:inline-block;vertical-align:text-bottom;margin-right:8px;"><path d="M8 1.5c-2.363 0-4 1.69-4 3.75 0 .984.424 1.625.984 2.304l.214.253c.223.264.47.556.673.868.312.48.529 1.01.616 1.575h3.026c.087-.565.304-1.095.616-1.575.203-.312.45-.604.673-.868l.214-.253c.56-.679.984-1.32.984-2.304 0-2.06-1.637-3.75-4-3.75ZM5.75 12h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1 0-1.5ZM6 14.25a.75.75 0 0 1 .75-.75h2.5a.75.75 0 0 1 0 1.5h-2.5a.75.75 0 0 1-.75-.75Z"></path></svg>' },
        'IMPORTANT': { class: 'markdown-alert-important', title: 'Important', icon: '<svg class="octicon octicon-report" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" style="display:inline-block;vertical-align:text-bottom;margin-right:8px;"><path d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v9.5A1.75 1.75 0 0 1 14.25 13H11l-2.5 2.5a.75.75 0 0 1-1 0L5 13H1.75A1.75 1.75 0 0 1 0 11.25Zm1.75-.25a.25.25 0 0 0-.25.25v9.5c0 .138.112.25.25.25h3.5a.75.75 0 0 1 .53.22L8 14.44l2.47-2.47a.75.75 0 0 1 .53-.22h3.25a.25.25 0 0 0 .25-.25v-9.5a.25.25 0 0 0-.25-.25ZM8 3.5a.75.75 0 0 1 .75.75v2.5a.75.75 0 0 1-1.5 0v-2.5A.75.75 0 0 1 8 3.5ZM8 9a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path></svg>' },
        'WARNING': { class: 'markdown-alert-warning', title: 'Warning', icon: '<svg class="octicon octicon-alert" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" style="display:inline-block;vertical-align:text-bottom;margin-right:8px;"><path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"></path></svg>' },
        'CAUTION': { class: 'markdown-alert-caution', title: 'Caution', icon: '<svg class="octicon octicon-stop" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" style="display:inline-block;vertical-align:text-bottom;margin-right:8px;"><path d="M4.47.22A.749.749 0 0 1 5 0h6c.199 0 .389.079.53.22l4.25 4.25c.141.141.22.331.22.53v6c0 .199-.079.389-.22.53l-4.25 4.25a.749.749 0 0 1-.53.22H5a.749.749 0 0 1-.53-.22L.22 11.53A.749.749 0 0 1 0 11V5c0-.199.079-.389.22-.53Zm.84 1.28L1.5 5.31v5.38l3.81 3.81h5.38l3.81-3.81V5.31L10.69 1.5ZM8 4a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 8 4Zm0 6a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z"></path></svg>' }
      };

      document.querySelectorAll('blockquote').forEach((bq) => {
        const firstP = bq.querySelector('p');
        if (!firstP) return;
        const match = firstP.innerHTML.match(/^\[\!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>)?\s*/i);
        if (match) {
          const type = match[1].toUpperCase();
          const config = alertConfigs[type];
          if (config) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `markdown-alert ${config.class}`;
            
            const titleP = document.createElement('p');
            titleP.className = 'markdown-alert-title';
            titleP.innerHTML = `${config.icon}${config.title}`;
            alertDiv.appendChild(titleP);

            firstP.innerHTML = firstP.innerHTML.replace(/^\[\!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>)?\s*/i, '');
            
            while (bq.firstChild) {
              alertDiv.appendChild(bq.firstChild);
            }
            
            bq.parentNode.replaceChild(alertDiv, bq);
          }
        }
      });

      // Запускаємо рендер
      mermaid.run();
    });
  </script>
</body>
</html>
