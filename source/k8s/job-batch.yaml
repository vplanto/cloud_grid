# ==============================================================================
# Kubernetes Job: Distributed Batch Monte Carlo Simulation
# Course: Cloud and Grid Systems (Stage 4: Kubernetes Orchestration)
# ==============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: reactor-batch-monte-carlo
  labels:
    app.kubernetes.io/name: reactor-batch
    app.kubernetes.io/part-of: cloud-grid-system
    workload: monte-carlo-trial
spec:
  # Total successful completions required to consider the Job finished
  completions: 4
  # Number of Pods allowed to compute in parallel concurrently
  parallelism: 2
  # Number of retries before marking this job as failed
  backoffLimit: 3
  # Maximum overall wall-clock runtime for the entire job (Deadlock / stall watchdog)
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        workload: monte-carlo-trial
    spec:
      # Batch Pods must NEVER have restartPolicy: Always
      restartPolicy: OnFailure
      containers:
        - name: monte-carlo-worker
          image: reactor-web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SIM_WORKERS
              value: "2"
            - name: SIM_STEPS
              value: "20"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              # Навчальний кейс: початковий маніфест з лімітом 512Mi та помилковими ключами
              # Виправлена версія — у job-batch-fixed.yaml
              memory: "512Mi"
          command: ["python", "-c"]
          args:
            - |
              import os, sys, time, json
              from app import ReactorSimulationEngine

              workers = int(os.environ.get("SIM_WORKERS", 2))
              steps = int(os.environ.get("SIM_STEPS", 20))
              pod_name = os.environ.get("HOSTNAME", "pod-unknown")

              print(f"[{pod_name}] 🚀 Worker launched. Cores={workers}, Steps={steps}")
              engine = ReactorSimulationEngine(num_workers=workers)

              t0 = time.perf_counter()
              for s in range(1, steps + 1):
                  st = engine.step()
                  if s % 5 == 0 or s == steps:
                      # Навчальний кейс: невідповідність ключів словника (st['k'] замість st['k_factor'])
                      # викликає KeyError, вичерпує backoffLimit та переводить Job у статус Failed
                      print(f"[{pod_name}] Step {s:02d}/{steps}: k_eff={st['k']:.4f}, Fissions={st['fissions']}, dt={st['step_time_ms']:.1f}ms")

              total_sec = time.perf_counter() - t0
              print(f"[{pod_name}] ✅ Batch run successfully completed in {total_sec:.2f}s!")
              sys.exit(0)
