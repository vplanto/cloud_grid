# ==============================================================================
# Kubernetes Deployment (Fixed Resources): Reactor Web & Telemetry Service
# Course: Cloud and Grid Systems (Stage 4: Kubernetes Orchestration)
# Fix: Raised memory limit to 1Gi to eliminate OOMKilled (Exit Code 137)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reactor-web-deployment
  labels:
    app.kubernetes.io/name: reactor-web
    app.kubernetes.io/part-of: cloud-grid-system
    app.kubernetes.io/component: simulation-dashboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reactor-web
  template:
    metadata:
      labels:
        app: reactor-web
    spec:
      containers:
        - name: reactor-service
          # Local image built during Stage 3 (Docker & Web)
          image: reactor-web:latest
          # CRITICAL: IfNotPresent prevents kubelet from failing to pull locally loaded images
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-web
          env:
            - name: PORT
              value: "8080"
            - name: SIM_WORKERS
              value: "2"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              # ВИПРАВЛЕНО: Збільшено до 1Gi для усунення OOMKilled (Exit Code 137)
              # під час паралельної обробки 500 000 частинок через multiprocessing.Pool
              memory: "1Gi"
          # 1. Startup Probe: Allows slow warm-up without killing the container prematurely
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          # 2. Liveness Probe (Heartbeats): Restarts deadlocked / wedged containers
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # 3. Readiness Probe: Excludes container from Service endpoint pool until ready
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
